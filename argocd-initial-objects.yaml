# ArgoCD App-of-Apps Configuration
# This file is used as a template for the argocd-apps Helm chart values.
# The actual values are dynamically generated by the component based on user inputs.

# Example structure (actual values are provided programmatically):
applications:
  - name: app-of-apps
    namespace: argocd
    project: default
    source:
      # Repository URL - configured via component args
      repoURL: ""
      # Branch to sync from - configured via component args (default: main)
      targetRevision: main
      # Path within repository - configured via component args (default: .)
      path: .
      # Directory configuration for recursive discovery
      directory:
        recurse: true
        # Exclude patterns:
        # - values*.yaml: Helm values files
        # - **/dashboards/**: Grafana dashboards
        # - **/policies/**: Policy files
        # - **/provider-configs/**: Provider configuration files
        exclude: "{values*.yaml,**/dashboards/**,**/policies/**,**/provider-configs/**}"
    destination:
      # Target Kubernetes cluster
      server: "https://kubernetes.default.svc"
      # Target namespace
      namespace: argocd
    syncPolicy:
      # Automated sync configuration
      automated:
        # Enable automatic pruning of resources
        prune: true
        # Enable automatic self-healing
        selfHeal: true
      # Sync options
      syncOptions:
        # Use server-side apply for better conflict resolution
        - "ServerSideApply=true"
        # Automatically create namespaces if they don't exist
        - "CreateNamespace=true"
